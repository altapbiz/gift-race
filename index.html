<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TikTok Gift Race</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#050509;
  color:white;
}

body{
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:700px;
  height:100vh;
  height:100dvh;
  background:
    radial-gradient(circle at 50% 0%,#20202b 0%,#09090e 45%,#030305 100%);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */

.header{
  height:72px;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid #292936;
  background:rgba(10,10,16,.96);
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:1px;
}

.live{
  background:#ff1744;
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:900;
  box-shadow:0 0 15px rgba(255,23,68,.45);
}

.score{
  text-align:right;
}

.score small{
  display:block;
  color:#999;
  font-size:10px;
}

.score strong{
  font-size:20px;
}

/* RACE */

.race{
  position:relative;
  flex:1;
  min-height:0;
  margin:8px 10px;
  border-radius:15px;
  overflow:hidden;
  border:2px solid #292934;
  background:
    linear-gradient(
      90deg,
      #101015 0%,
      #17171e 50%,
      #101015 100%
    );
}

/* FINISH */

.finish{
  position:absolute;
  right:18px;
  top:0;
  bottom:0;
  width:5px;
  z-index:3;
  background:repeating-linear-gradient(
    to bottom,
    white 0 12px,
    #111 12px 24px
  );
  opacity:.9;
}

/* LANES */

.lane{
  height:20%;
  position:relative;
  border-bottom:1px dashed #393943;
}

.lane:last-child{
  border-bottom:none;
}

/* COUNTRY */

.country{
  position:absolute;
  left:8px;
  top:7px;
  z-index:4;
  background:rgba(0,0,0,.65);
  border-radius:7px;
  padding:3px 6px;
  font-size:11px;
  font-weight:900;
  border:1px solid #383842;
}

/* CAR */

.car{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:78px;
  height:38px;
  transition:left .45s cubic-bezier(.2,.8,.2,1);
  z-index:5;
}

.car-body{
  position:absolute;
  width:62px;
  height:23px;
  left:8px;
  top:8px;
  border-radius:7px 12px 8px 8px;
  background:linear-gradient(180deg,#efefef,#7c7c85);
  border:2px solid #333;
}

.car-top{
  position:absolute;
  width:31px;
  height:17px;
  left:19px;
  top:0;
  border-radius:9px 10px 2px 2px;
  background:#85858d;
  border:2px solid #333;
}

.window{
  position:absolute;
  width:22px;
  height:10px;
  left:23px;
  top:3px;
  background:#111722;
  border-radius:4px;
}

.wheel{
  position:absolute;
  width:13px;
  height:13px;
  background:#080808;
  border:2px solid #555;
  border-radius:50%;
  bottom:0;
}

.wheel.one{
  left:14px;
}

.wheel.two{
  right:8px;
}

.car.red .car-body{
  background:linear-gradient(180deg,#ff4c65,#8d0016);
}

.car.blue .car-body{
  background:linear-gradient(180deg,#4ea6ff,#064d9f);
}

.car.green .car-body{
  background:linear-gradient(180deg,#52e58b,#087a3c);
}

.car.yellow .car-body{
  background:linear-gradient(180deg,#ffe56b,#c39100);
}

.car.purple .car-body{
  background:linear-gradient(180deg,#c679ff,#67219b);
}

/* PLAYER */

.player-name{
  position:absolute;
  left:92px;
  top:50%;
  transform:translateY(-50%);
  font-size:11px;
  color:#aaa;
  font-weight:700;
  z-index:2;
}

/* BOTTOM */

.bottom{
  height:205px;
  min-height:205px;
  padding:10px 10px 12px;
  background:#09090e;
  border-top:1px solid #292936;
}

.gift-title{
  text-align:center;
  font-size:12px;
  color:#999;
  margin-bottom:8px;
  font-weight:700;
}

.gifts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.gift{
  height:112px;
  border-radius:13px;
  border:1px solid #30303b;
  background:linear-gradient(180deg,#171720,#0e0e14);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  user-select:none;
}

.gift:active{
  transform:scale(.96);
}

.gift img{
  width:55px;
  height:55px;
  object-fit:contain;
  display:block;
  margin-bottom:7px;
}

.gift-name{
  font-size:11px;
  font-weight:900;
}

.gift-points{
  margin-top:4px;
  font-size:10px;
  color:#aaa;
}

.test{
  width:100%;
  height:39px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#242431;
  color:#fff;
  font-size:12px;
  font-weight:900;
}

.reset{
  background:#15151d;
  border:1px solid #30303a;
}

/* WINNER */

.winner{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.winner-box{
  width:85%;
  max-width:350px;
  background:#12121a;
  border:1px solid #444452;
  border-radius:20px;
  padding:25px;
  text-align:center;
}

.winner-box h1{
  font-size:28px;
  margin-bottom:10px;
}

.winner-box p{
  color:#aaa;
  margin-bottom:20px;
}

.winner-box button{
  width:100%;
  height:45px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-weight:900;
}

/* SMALL SCREEN */

@media(max-height:650px){

  .header{
    height:60px;
    min-height:60px;
  }

  .bottom{
    height:175px;
    min-height:175px;
  }

  .gift{
    height:88px;
  }

  .gift img{
    width:42px;
    height:42px;
  }

  .test{
    height:32px;
    margin-top:5px;
  }
}

@media(max-width:360px){

  .gift{
    height:100px;
  }

  .gift img{
    width:45px;
    height:45px;
  }

  .gift-name{
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="header">
    <div>
      <div class="logo">GIFT RACE</div>
    </div>

    <div class="live">● LIVE</div>

    <div class="score">
      <small>ÜMUMİ XAL</small>
      <strong id="totalScore">0</strong>
    </div>
  </div>


  <div class="race">

    <div class="finish"></div>

    <!-- AZERBAIJAN -->
    <div class="lane">
      <div class="country">🇦🇿 AZ</div>
      <div class="player-name" id="name0">AZERBAIJAN</div>

      <div class="car red" id="car0">
        <div class="car-top">
          <div class="window"></div>
        </div>
        <div class="car-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
      </div>
    </div>


    <!-- TURKEY -->
    <div class="lane">
      <div class="country">🇹🇷 TR</div>
      <div class="player-name" id="name1">TURKEY</div>

      <div class="car blue" id="car1">
        <div class="car-top">
          <div class="window"></div>
        </div>
        <div class="car-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
      </div>
    </div>


    <!-- GEORGIA -->
    <div class="lane">
      <div class="country">🇬🇪 GE</div>
      <div class="player-name" id="name2">GEORGIA</div>

      <div class="car green" id="car2">
        <div class="car-top">
          <div class="window"></div>
        </div>
        <div class="car-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
      </div>
    </div>


    <!-- RUSSIA -->
    <div class="lane">
      <div class="country">🇷🇺 RU</div>
      <div class="player-name" id="name3">RUSSIA</div>

      <div class="car yellow" id="car3">
        <div class="car-top">
          <div class="window"></div>
        </div>
        <div class="car-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
      </div>
    </div>


    <!-- UKRAINE -->
    <div class="lane">
      <div class="country">🇺🇦 UA</div>
      <div class="player-name" id="name4">UKRAINE</div>

      <div class="car purple" id="car4">
        <div class="car-top">
          <div class="window"></div>
        </div>
        <div class="car-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
      </div>
    </div>

  </div>


  <div class="bottom">

    <div class="gift-title">
      TIKTOK HƏDİYYƏLƏRİ
    </div>

    <div class="gifts">

      <!-- GÜL -->
      <div class="gift" onclick="sendGift(1)">
        <img src="images/rose.png" alt="Gül">
        <div class="gift-name">Gül</div>
        <div class="gift-points">1 xal</div>
      </div>


      <!-- PARFÜM -->
      <div class="gift" onclick="sendGift(10)">
        <img src="images/perfume.png" alt="Parfüm">
        <div class="gift-name">Parfüm</div>
        <div class="gift-points">10 xal</div>
      </div>


      <!-- TAC -->
      <div class="gift" onclick="sendGift(100)">
        <img src="images/crown.png" alt="Tac">
        <div class="gift-name">Tac</div>
        <div class="gift-points">100 xal</div>
      </div>


      <!-- ŞAPKA -->
      <div class="gift" onclick="sendGift(99)">
        <img src="images/hat.png" alt="Şapka">
        <div class="gift-name">Şapka</div>
        <div class="gift-points">99 xal</div>
      </div>

    </div>


    <button class="test" onclick="randomGift()">
      TEST HƏDİYYƏ GÖNDƏR
    </button>

    <button class="test reset" onclick="resetGame()">
      SIFIRLA
    </button>

  </div>

</div>


<div class="winner" id="winner">
  <div class="winner-box">
    <h1>🏁 QALİB!</h1>
    <p id="winnerText"></p>
    <button onclick="closeWinner()">DAVAM ET</button>
  </div>
</div>


<script>

const players = [
  {
    name:"AZERBAIJAN",
    points:0,
    position:12
  },
  {
    name:"TURKEY",
    points:0,
    position:12
  },
  {
    name:"GEORGIA",
    points:0,
    position:12
  },
  {
    name:"RUSSIA",
    points:0,
    position:12
  },
  {
    name:"UKRAINE",
    points:0,
    position:12
  }
];

let totalScore = 0;
let gameFinished = false;


/* HƏDİYYƏ GƏLƏNDƏ */

function sendGift(points){

  if(gameFinished) return;

  /*
    Hazırda test üçün təsadüfi maşın seçilir.

    Daha sonra TikTok LIVE bağlantısı əlavə ediləndə
    burada hansı istifadəçiyə hədiyyə gəlibsə,
    həmin oyunçunun maşını seçiləcək.
  */

  const playerIndex =
    Math.floor(Math.random() * players.length);

  players[playerIndex].points += points;

  totalScore += points;

  document.getElementById("totalScore").innerText =
    totalScore;

  moveCar(playerIndex,points);

  checkWinner();
}


/* MAŞINI İRƏLİ APAR */

function moveCar(playerIndex,points){

  const player = players[playerIndex];

  /*
    Xal nə qədər çoxdursa,
    maşın bir o qədər çox irəliləyir.
  */

  const movement = points * 0.55;

  player.position += movement;

  if(player.position > 83){
    player.position = 83;
  }

  const car =
    document.getElementById("car"+playerIndex);

  car.style.left =
    player.position + "%";
}


/* TEST */

function randomGift(){

  const gifts = [
    1,
    10,
    100,
    99
  ];

  const points =
    gifts[Math.floor(Math.random()*gifts.length)];

  sendGift(points);
}


/* QALİB */

function checkWinner(){

  for(let i=0;i<players.length;i++){

    if(players[i].position >= 83){

      gameFinished = true;

      document.getElementById("winnerText").innerText =
        players[i].name +
        " qalib oldu!";

      document.getElementById("winner")
        .style.display="flex";

      break;
    }
  }
}


/* DAVAM ET */

function closeWinner(){

  document.getElementById("winner")
    .style.display="none";

  resetGame();
}


/* SIFIRLA */

function resetGame(){

  totalScore = 0;
  gameFinished = false;

  document.getElementById("totalScore")
    .innerText="0";

  players.forEach((player,index)=>{

    player.points=0;
    player.position=12;

    document.getElementById("car"+index)
      .style.left="12%";
  });

  document.getElementById("winner")
    .style.display="none";
}


/*
====================================================
TIKTOK LIVE GIFT SİSTEMİ ÜÇÜN ƏSAS FUNKSİYA
====================================================

TikTok-dan real hədiyyə məlumatı gələndə
server bu funksiyanı çağırmalıdır.

Məsələn:

receiveTikTokGift("rose",1);
receiveTikTokGift("perfume",10);
receiveTikTokGift("crown",100);
receiveTikTokGift("hat",99);

*/

function receiveTikTokGift(giftName,points){

  console.log(
    "TikTok hədiyyəsi:",
    giftName,
    "Xal:",
    points
  );

  sendGift(points);
}


/*
====================================================
HƏDİYYƏ XƏRİTƏSİ
====================================================
*/

const tiktokGifts = {

  rose:{
    name:"Gül",
    points:1,
    image:"images/rose.png"
  },

  perfume:{
    name:"Parfüm",
    points:10,
    image:"images/perfume.png"
  },

  crown:{
    name:"Tac",
    points:100,
    image:"images/crown.png"
  },

  hat:{
    name:"Şapka",
    points:99,
    image:"images/hat.png"
  }

};

</script>

</body>
</html>
