<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>UKRAINE VS RUSSIA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050507;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:760px;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at top,#20202a,#07070b 60%);
}


/* HEADER */

.header{
  height:76px;
  min-height:76px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:#101016;
  border-bottom:1px solid #30303a;
}

.title{
  font-size:18px;
  font-weight:900;
}

.live{
  background:#ff1744;
  padding:8px 13px;
  border-radius:20px;
  font-size:12px;
  font-weight:900;
}

.total{
  text-align:right;
}

.total span{
  display:block;
  color:#999;
  font-size:9px;
}

.total strong{
  font-size:20px;
}


/* SCORE */

.scoreboard{
  height:105px;
  min-height:105px;

  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;

  padding:8px 10px;

  background:#0c0c12;
  border-bottom:1px solid #292932;
}

.team{
  text-align:center;
}

.team-name{
  font-size:16px;
  font-weight:900;
}

.team-score{
  margin-top:5px;
  font-size:24px;
  font-weight:900;
}

.team-limit{
  margin-top:2px;
  color:#777;
  font-size:9px;
}

.vs{
  text-align:center;
  font-size:22px;
  font-weight:900;
  color:#777;
}


/* RACE */

.race{
  flex:1;
  min-height:0;

  margin:8px;

  position:relative;
  overflow:hidden;

  border:2px solid #2c2c37;
  border-radius:16px;

  background:
    linear-gradient(
      90deg,
      #111117,
      #181820,
      #111117
    );
}

.finish{
  position:absolute;

  right:18px;
  top:0;
  bottom:0;

  width:7px;

  z-index:10;

  background:
    repeating-linear-gradient(
      to bottom,
      #fff 0 12px,
      #111 12px 24px
    );
}


/* LANES */

.lane{
  position:relative;
  height:50%;

  border-bottom:1px dashed #3a3a45;
}

.lane:last-child{
  border-bottom:0;
}


/* COUNTRY */

.country{
  position:absolute;

  left:8px;
  top:9px;

  display:flex;
  align-items:center;
  gap:8px;

  padding:6px 9px;

  background:rgba(0,0,0,.72);

  border:1px solid #393943;
  border-radius:9px;

  z-index:8;
}

.flag{
  font-size:31px;
  line-height:1;
}

.country-name{
  font-size:13px;
  font-weight:900;
}


/* PROGRESS */

.progress{
  position:absolute;

  left:8px;
  right:18px;
  bottom:8px;

  height:5px;

  background:#292932;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;

  border-radius:10px;

  transition:width .4s ease;
}

.ukraine-bar{
  background:#2589ff;
}

.russia-bar{
  background:#ff3d52;
}


/* CAR */

.car{
  position:absolute;

  left:125px;
  top:56%;

  width:90px;
  height:43px;

  transform:translateY(-50%);

  transition:left .45s cubic-bezier(.2,.8,.2,1);

  z-index:6;
}

.car-body{
  position:absolute;

  left:7px;
  top:10px;

  width:73px;
  height:25px;

  border-radius:7px 14px 8px 8px;

  border:2px solid #252525;

  background:linear-gradient(
    180deg,
    #eee,
    #777
  );
}

.car-top{
  position:absolute;

  left:22px;
  top:0;

  width:38px;
  height:20px;

  border-radius:10px 10px 2px 2px;

  border:2px solid #252525;

  background:#777;

  z-index:2;
}

.window{
  position:absolute;

  left:4px;
  top:3px;

  width:26px;
  height:11px;

  background:#111923;

  border-radius:4px;
}

.wheel{
  position:absolute;

  bottom:0;

  width:15px;
  height:15px;

  border-radius:50%;

  background:#050505;
  border:2px solid #555;
}

.wheel.one{
  left:13px;
}

.wheel.two{
  right:7px;
}


/* COLORS */

.ukraine-car .car-body{
  background:linear-gradient(
    180deg,
    #3f9cff,
    #0751a8
  );
}

.russia-car .car-body{
  background:linear-gradient(
    180deg,
    #ff5366,
    #940014
  );
}


/* GIFT INFO */

.gift-info{
  position:absolute;

  right:10px;
  top:10px;

  padding:6px 9px;

  background:rgba(0,0,0,.7);

  border:1px solid #33333d;
  border-radius:8px;

  text-align:right;

  z-index:9;
}

.gift-info small{
  display:block;
  color:#999;
  font-size:9px;
}

.gift-info strong{
  font-size:12px;
}


/* BOTTOM */

.bottom{
  height:185px;
  min-height:185px;

  padding:9px;

  background:#09090e;

  border-top:1px solid #292932;
}

.gift-title{
  text-align:center;

  font-size:13px;
  font-weight:900;

  margin-bottom:7px;
}

.gifts{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:7px;
}

.gift{
  height:62px;

  display:flex;
  align-items:center;

  padding:7px 10px;

  border-radius:11px;

  background:#15151d;

  border:1px solid #30303a;
}

.gift-icon{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;

  margin-right:9px;
}

.gift-text{
  text-align:left;
}

.gift-name{
  font-size:12px;
  font-weight:900;
}

.gift-team{
  margin-top:3px;
  font-size:10px;
  color:#aaa;
}

.test{
  width:100%;
  height:34px;

  margin-top:7px;

  border:0;
  border-radius:8px;

  background:#292934;

  color:#fff;

  font-size:11px;
  font-weight:900;
}

.reset{
  margin-top:5px;
  background:#15151b;
}


/* WINNER */

.winner{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.82);

  z-index:100;
}

.winner-box{
  width:85%;
  max-width:350px;

  padding:28px;

  text-align:center;

  background:#15151d;

  border:1px solid #444451;
  border-radius:20px;
}

.winner-box h1{
  font-size:28px;
  margin-bottom:10px;
}

.winner-box p{
  color:#aaa;
  margin-bottom:20px;
}

.winner-box button{
  width:100%;
  height:45px;

  border:0;
  border-radius:10px;

  background:#fff;
  color:#000;

  font-weight:900;
}


/* SMALL PHONE */

@media(max-width:380px){

  .header{
    height:68px;
    min-height:68px;
  }

  .title{
    font-size:15px;
  }

  .scoreboard{
    height:94px;
    min-height:94px;
  }

  .team-name{
    font-size:14px;
  }

  .team-score{
    font-size:21px;
  }

  .flag{
    font-size:27px;
  }

  .country-name{
    font-size:11px;
  }

  .car{
    left:115px;
  }

  .bottom{
    height:178px;
    min-height:178px;
  }

  .gift{
    height:58px;
  }

  .gift-icon{
    font-size:24px;
  }
}

</style>
</head>


<body>

<div class="game">


<!-- HEADER -->

<div class="header">

  <div class="title">
    🇺🇦 УКРАИНА VS РОССИЯ 🇷🇺
  </div>

  <div class="live">
    ● LIVE
  </div>

  <div class="total">
    <span>ВСЕГО ОЧКОВ</span>
    <strong id="totalScore">0</strong>
  </div>

</div>



<!-- SCORE -->

<div class="scoreboard">

  <div class="team">

    <div class="team-name">
      🇺🇦 УКРАИНА
    </div>

    <div
      class="team-score"
      id="ukraineScore">
      0
    </div>

    <div class="team-limit">
      ЦЕЛЬ: 500 000
    </div>

  </div>


  <div class="vs">
    VS
  </div>


  <div class="team">

    <div class="team-name">
      🇷🇺 РОССИЯ
    </div>

    <div
      class="team-score"
      id="russiaScore">
      0
    </div>

    <div class="team-limit">
      ЦЕЛЬ: 500 000
    </div>

  </div>

</div>



<!-- RACE -->

<div class="race">

  <div class="finish"></div>


  <!-- UKRAINE -->

  <div class="lane">

    <div class="country">

      <div class="flag">
        🇺🇦
      </div>

      <div class="country-name">
        УКРАИНА
      </div>

    </div>


    <div class="gift-info">

      <small>
        ПОДАРОК
      </small>

      <strong id="ukraineGift">
        ШАПКА
      </strong>

    </div>


    <div
      class="car ukraine-car"
      id="ukraineCar">

      <div class="car-top">

        <div class="window"></div>

      </div>

      <div class="car-body"></div>

      <div class="wheel one"></div>
      <div class="wheel two"></div>

    </div>


    <div class="progress">

      <div
        class="progress-bar ukraine-bar"
        id="ukraineProgress">
      </div>

    </div>

  </div>



  <!-- RUSSIA -->

  <div class="lane">

    <div class="country">

      <div class="flag">
        🇷🇺
      </div>

      <div class="country-name">
        РОССИЯ
      </div>

    </div>


    <div class="gift-info">

      <small>
        ПОДАРОК
      </small>

      <strong id="russiaGift">
        КОРОНА
      </strong>

    </div>


    <div
      class="car russia-car"
      id="russiaCar">

      <div class="car-top">

        <div class="window"></div>

      </div>

      <div class="car-body"></div>

      <div class="wheel one"></div>
      <div class="wheel two"></div>

    </div>


    <div class="progress">

      <div
        class="progress-bar russia-bar"
        id="russiaProgress">
      </div>

    </div>

  </div>

</div>



<!-- GIFTS -->

<div class="bottom">

  <div class="gift-title">
    ПОДАРКИ TIKTOK
  </div>


  <div class="gifts">


    <div class="gift">

      <div class="gift-icon">
        👑
      </div>

      <div class="gift-text">

        <div class="gift-name">
          Корона
        </div>

        <div class="gift-team">
          🇷🇺 Россия
        </div>

      </div>

    </div>


    <div class="gift">

      <div class="gift-icon">
        🧢
      </div>

      <div class="gift-text">

        <div class="gift-name">
          Шапка
        </div>

        <div class="gift-team">
          🇺🇦 Украина
        </div>

      </div>

    </div>

  </div>


  <button
    class="test"
    onclick="testRussia()">

    ТЕСТ: КОРОНА → РОССИЯ

  </button>


  <button
    class="test"
    onclick="testUkraine()">

    ТЕСТ: ШАПКА → УКРАИНА

  </button>


  <button
    class="test reset"
    onclick="resetGame()">

    СБРОСИТЬ

  </button>

</div>

</div>



<!-- WINNER -->

<div
  class="winner"
  id="winner">

  <div class="winner-box">

    <h1>
      🏆 ПОБЕДИТЕЛЬ
    </h1>

    <p id="winnerText"></p>

    <button onclick="closeWinner()">
      ЗАКРЫТЬ
    </button>

  </div>

</div>



<script>

/*
==========================================
ИГРОВЫЕ ПРАВИЛА
==========================================

🇷🇺 КОРОНА  → РОССИЯ
🇺🇦 ШАПКА   → УКРАИНА

ЦЕЛЬ:
500 000 ОЧКОВ
==========================================
*/


const MAX_SCORE = 500000;


let ukraineScore = 0;

let russiaScore = 0;

let gameFinished = false;



/*
------------------------------------------
ДОБАВИТЬ ОЧКИ
------------------------------------------
*/

function addScore(
  team,
  points,
  giftName
){

  if(gameFinished){
    return;
  }


  if(team === "ukraine"){

    ukraineScore += points;

    document.getElementById(
      "ukraineGift"
    ).innerText =
      giftName;

  }


  if(team === "russia"){

    russiaScore += points;

    document.getElementById(
      "russiaGift"
    ).innerText =
      giftName;

  }


  updateScreen();


  checkWinner();

}



/*
------------------------------------------
ЭКРАН
------------------------------------------
*/

function updateScreen(){

  document.getElementById(
    "ukraineScore"
  ).innerText =
    ukraineScore.toLocaleString("ru-RU");


  document.getElementById(
    "russiaScore"
  ).innerText =
    russiaScore.toLocaleString("ru-RU");


  document.getElementById(
    "totalScore"
  ).innerText =
    (
      ukraineScore +
      russiaScore
    ).toLocaleString("ru-RU");


  let ukrainePercent =
    (ukraineScore / MAX_SCORE) * 100;


  let russiaPercent =
    (russiaScore / MAX_SCORE) * 100;


  if(ukrainePercent > 100){
    ukrainePercent = 100;
  }


  if(russiaPercent > 100){
    russiaPercent = 100;
  }


  document.getElementById(
    "ukraineProgress"
  ).style.width =
    ukrainePercent + "%";


  document.getElementById(
    "russiaProgress"
  ).style.width =
    russiaPercent + "%";


  /*
    Maşın finiş xəttinə doğru hərəkət edir.
  */

  const ukrainePosition =
    125 +
    (
      ukrainePercent *
      0.62
    );


  const russiaPosition =
    125 +
    (
      russiaPercent *
      0.62
    );


  document.getElementById(
    "ukraineCar"
  ).style.left =
    ukrainePosition + "%";


  document.getElementById(
    "russiaCar"
  ).style.left =
    russiaPosition + "%";

}



/*
------------------------------------------
QALİB
------------------------------------------
*/

function checkWinner(){

  if(
    ukraineScore >= MAX_SCORE
  ){

    finishGame(
      "🇺🇦 УКРАИНА"
    );

  }


  if(
    russiaScore >= MAX_SCORE
  ){

    finishGame(
      "🇷🇺 РОССИЯ"
    );

  }

}



/*
------------------------------------------
OYUNU BITIR
------------------------------------------
*/

function finishGame(
  winner
){

  gameFinished = true;


  document.getElementById(
    "winnerText"
  ).innerText =
    winner +
    " достигла 500 000 очков!";


  document.getElementById(
    "winner"
  ).style.display =
    "flex";

}



/*
------------------------------------------
TEST: РОССИЯ
------------------------------------------
*/

function testRussia(){

  /*
    Test üçün 100 xal.
    Daha sonra TikTok-dan gələn
    real coin dəyəri burada istifadə olunacaq.
  */

  addScore(
    "russia",
    100,
    "КОРОНА"
  );

}



/*
------------------------------------------
TEST: УКРАИНА
------------------------------------------
*/

function testUkraine(){

  addScore(
    "ukraine",
    100,
    "ШАПКА"
  );

}



/*
------------------------------------------
REAL TIKTOK GIFT
------------------------------------------

Serverdən belə çağırılacaq:

receiveTikTokGift(
  "crown",
  500
);

və ya

receiveTikTokGift(
  "hat",
  1000
);

*/

function receiveTikTokGift(
  gift,
  coins
){

  if(gift === "crown"){

    addScore(
      "russia",
      coins,
      "КОРОНА"
    );

  }


  if(gift === "hat"){

    addScore(
      "ukraine",
      coins,
      "ШАПКА"
    );

  }

}



/*
------------------------------------------
RESET
------------------------------------------
*/

function resetGame(){

  ukraineScore = 0;

  russiaScore = 0;

  gameFinished = false;


  document.getElementById(
    "winner"
  ).style.display =
    "none";


  document.getElementById(
    "ukraineGift"
  ).innerText =
    "ШАПКА";


  document.getElementById(
    "russiaGift"
  ).innerText =
    "КОРОНА";


  updateScreen();

}



/*
------------------------------------------
START
------------------------------------------
*/

updateScreen();

</script>

</body>
</html>
