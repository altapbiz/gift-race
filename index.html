<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Украина VS Россия</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
    radial-gradient(circle at 50% 20%,#252525 0%,#0d0d0d 45%,#000 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
}

.app{
    width:100%;
    max-width:850px;
    height:100vh;
    max-height:760px;
    padding:10px 14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:9px;
}

/* BAŞLIQ */

.title{
    text-align:center;
    font-size:clamp(18px,4vw,30px);
    font-weight:900;
    line-height:1.1;
}

.subtitle{
    text-align:center;
    color:#999;
    font-size:clamp(10px,2.5vw,14px);
}

/* SCORE */

.scores{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.team{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:9px;
    text-align:center;
}

.flag{
    width:clamp(52px,13vw,78px);
    height:clamp(52px,13vw,78px);
    border-radius:50%;
    margin:0 auto 5px;
    border:3px solid rgba(255,255,255,.85);
    box-shadow:0 0 15px rgba(255,255,255,.15);
    position:relative;
    overflow:hidden;
}

.flag:after{
    content:"";
    position:absolute;
    left:15%;
    top:0;
    width:30%;
    height:100%;
    background:rgba(255,255,255,.25);
    transform:skewX(-20deg);
}

/* UKRAINE */

.ukraine-flag{
    background:linear-gradient(
        to bottom,
        #0057b8 0 50%,
        #ffd700 50% 100%
    );
}

/* RUSSIA */

.russia-flag{
    background:linear-gradient(
        to bottom,
        #fff 0 33.33%,
        #0039a6 33.33% 66.66%,
        #d52b1e 66.66% 100%
    );
}

/* BAYRAQ YANIB-SÖNMƏ */

.flash{
    animation:flash .7s ease-in-out 3;
}

@keyframes flash{
    0%{
        transform:scale(1);
        filter:brightness(1);
        box-shadow:0 0 15px rgba(255,255,255,.2);
    }

    25%{
        transform:scale(1.18);
        filter:brightness(2.2);
        box-shadow:
        0 0 25px #fff,
        0 0 55px rgba(255,255,255,.9);
    }

    50%{
        transform:scale(1);
        filter:brightness(1);
    }

    75%{
        transform:scale(1.18);
        filter:brightness(2.2);
        box-shadow:
        0 0 25px #fff,
        0 0 55px rgba(255,255,255,.9);
    }

    100%{
        transform:scale(1);
        filter:brightness(1);
    }
}

.name{
    font-size:clamp(12px,3vw,17px);
    font-weight:900;
}

.score{
    font-size:clamp(24px,7vw,42px);
    font-weight:900;
    line-height:1.05;
    margin:3px 0;
}

.target{
    color:#777;
    font-size:10px;
}

.progress{
    height:7px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
    margin-top:5px;
}

.progress-bar{
    height:100%;
    width:0%;
    transition:width .5s ease;
}

.ukraine-progress{
    background:linear-gradient(90deg,#0057b8,#ffd700);
}

.russia-progress{
    background:linear-gradient(90deg,#fff,#0039a6,#d52b1e);
}

/* RACE */

.race{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    padding:9px;
}

.race-title{
    text-align:center;
    font-size:clamp(13px,3vw,18px);
    font-weight:900;
    margin-bottom:6px;
}

.lane{
    height:58px;
    background:#111;
    border-radius:12px;
    position:relative;
    overflow:hidden;
    margin-top:6px;
    border:1px solid #292929;
}

.lane-name{
    position:absolute;
    top:5px;
    left:9px;
    z-index:5;
    font-size:10px;
    font-weight:900;
}

.finish{
    position:absolute;
    right:7px;
    top:0;
    width:4px;
    height:100%;
    background:
    repeating-linear-gradient(
        to bottom,
        #fff 0 7px,
        #111 7px 14px
    );
}

/* MAŞIN */

.car{
    position:absolute;
    left:8px;
    bottom:10px;
    width:57px;
    height:25px;
    border-radius:8px 13px 6px 6px;
    transition:left .6s ease;
    z-index:3;
}

.car:before{
    content:"";
    position:absolute;
    width:26px;
    height:13px;
    left:17px;
    top:-9px;
    border-radius:6px 6px 2px 2px;
    background:inherit;
}

.car:after{
    content:"";
    position:absolute;
    width:9px;
    height:9px;
    background:#050505;
    border-radius:50%;
    left:7px;
    bottom:-5px;
    box-shadow:34px 0 0 #050505;
}

.ukraine-car{
    background:linear-gradient(135deg,#0057b8,#ffd700);
}

.russia-car{
    background:linear-gradient(135deg,#fff,#0039a6,#d52b1e);
}

/* HƏDİYYƏLƏR */

.gifts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.gift{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:8px;
    text-align:center;
}

.gift-icon{
    width:42px;
    height:42px;
    margin:auto;
    border-radius:11px;
    background:#1b1b1b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.gift-name{
    font-size:11px;
    font-weight:900;
    margin-top:4px;
}

.gift-team{
    color:#999;
    font-size:9px;
}

/* TEST */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr 70px;
    gap:6px;
}

button{
    border:0;
    border-radius:11px;
    padding:10px 5px;
    color:#fff;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

.russia-btn{
    background:#8e2020;
}

.ukraine-btn{
    background:#0758a8;
}

.reset-btn{
    background:#333;
}

/* STATUS */

.status{
    text-align:center;
    color:#777;
    font-size:9px;
}

/* WINNER */

.winner{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.92);
    z-index:100;
    padding:20px;
}

.winner.show{
    display:flex;
}

.winner-box{
    width:100%;
    max-width:420px;
    background:#151515;
    border:1px solid #444;
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
}

.trophy{
    font-size:55px;
}

.winner-name{
    font-size:25px;
    font-weight:900;
    margin-top:8px;
}

.winner-score{
    color:#999;
    margin-top:6px;
}

.new-game{
    background:#333;
    margin-top:18px;
    width:100%;
}

/* ÇOX KİÇİK EKRANLAR */

@media(max-height:650px){

    .app{
        gap:5px;
        padding:6px 10px;
    }

    .team{
        padding:6px;
    }

    .flag{
        width:45px;
        height:45px;
    }

    .score{
        font-size:25px;
    }

    .lane{
        height:48px;
    }

    .gift{
        padding:5px;
    }

    .gift-icon{
        width:34px;
        height:34px;
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="title">
        🇺🇦 УКРАИНА VS РОССИЯ 🇷🇺
    </div>

    <div class="subtitle">
        ПЕРВЫЙ ДО 500 000 ОЧКОВ ПОБЕЖДАЕТ
    </div>


    <!-- XALLAR -->

    <div class="scores">

        <div class="team">

            <div id="ukraineFlag"
                 class="flag ukraine-flag"></div>

            <div class="name">
                УКРАИНА
            </div>

            <div id="ukraineScore"
                 class="score">
                0
            </div>

            <div class="target">
                / 500 000
            </div>

            <div class="progress">
                <div id="ukraineProgress"
                     class="progress-bar ukraine-progress">
                </div>
            </div>

        </div>


        <div class="team">

            <div id="russiaFlag"
                 class="flag russia-flag"></div>

            <div class="name">
                РОССИЯ
            </div>

            <div id="russiaScore"
                 class="score">
                0
            </div>

            <div class="target">
                / 500 000
            </div>

            <div class="progress">
                <div id="russiaProgress"
                     class="progress-bar russia-progress">
                </div>
            </div>

        </div>

    </div>


    <!-- YARIŞ -->

    <div class="race">

        <div class="race-title">
            🏁 ГОНКА
        </div>

        <div class="lane">

            <div class="lane-name">
                🇺🇦 УКРАИНА
            </div>

            <div id="ukraineCar"
                 class="car ukraine-car">
            </div>

            <div class="finish"></div>

        </div>


        <div class="lane">

            <div class="lane-name">
                🇷🇺 РОССИЯ
            </div>

            <div id="russiaCar"
                 class="car russia-car">
            </div>

            <div class="finish"></div>

        </div>

    </div>


    <!-- HƏDİYYƏ -->

    <div class="gifts">

        <div class="gift">

            <div class="gift-icon">
                👑
            </div>

            <div class="gift-name">
                КОРОНА → РОССИЯ
            </div>

            <div class="gift-team">
                ПОДАРОК = ОЧКИ
            </div>

        </div>


        <div class="gift">

            <div class="gift-icon">
                🧢
            </div>

            <div class="gift-name">
                ШАПКА → УКРАИНА
            </div>

            <div class="gift-team">
                ПОДАРОК = ОЧКИ
            </div>

        </div>

    </div>


    <!-- TEST -->

    <div class="buttons">

        <button
            class="russia-btn"
            onclick="testRussia()">
            👑 РОССИЯ +100
        </button>

        <button
            class="ukraine-btn"
            onclick="testUkraine()">
            🧢 УКРАИНА +100
        </button>

        <button
            class="reset-btn"
            onclick="resetGame()">
            СБРОС
        </button>

    </div>


    <div id="status"
         class="status">
        ● LIVE SYSTEM READY
    </div>

</div>


<!-- WINNER -->

<div id="winner"
     class="winner">

    <div class="winner-box">

        <div class="trophy">
            🏆
        </div>

        <div id="winnerName"
             class="winner-name">
        </div>

        <div id="winnerScore"
             class="winner-score">
        </div>

        <button
            class="new-game"
            onclick="resetGame()">
            НОВАЯ ИГРА
        </button>

    </div>

</div>


<script>

const MAX_SCORE = 500000;

let ukraineScore = 0;
let russiaScore = 0;
let gameFinished = false;


const ukraineScoreEl =
document.getElementById("ukraineScore");

const russiaScoreEl =
document.getElementById("russiaScore");

const ukraineProgress =
document.getElementById("ukraineProgress");

const russiaProgress =
document.getElementById("russiaProgress");

const ukraineCar =
document.getElementById("ukraineCar");

const russiaCar =
document.getElementById("russiaCar");

const ukraineFlag =
document.getElementById("ukraineFlag");

const russiaFlag =
document.getElementById("russiaFlag");

const winner =
document.getElementById("winner");

const winnerName =
document.getElementById("winnerName");

const winnerScore =
document.getElementById("winnerScore");

const statusEl =
document.getElementById("status");


function numberFormat(n){

    return Math.floor(n)
    .toLocaleString("ru-RU");

}


/* BAYRAQ EFFEKTİ */

function flashFlag(team){

    const flag =
    team === "ukraine"
    ? ukraineFlag
    : russiaFlag;

    flag.classList.remove("flash");

    void flag.offsetWidth;

    flag.classList.add("flash");

}


/* XAL ƏLAVƏ ET */

function addScore(team, points){

    if(gameFinished) return;

    points = Number(points);

    if(!Number.isFinite(points) || points <= 0){
        return;
    }


    if(team === "ukraine"){

        ukraineScore += points;

        if(ukraineScore > MAX_SCORE){
            ukraineScore = MAX_SCORE;
        }

        flashFlag("ukraine");
    }


    if(team === "russia"){

        russiaScore += points;

        if(russiaScore > MAX_SCORE){
            russiaScore = MAX_SCORE;
        }

        flashFlag("russia");
    }


    updateScreen();

    checkWinner();

}


/* EKRANI YENİLƏ */

function updateScreen(){

    ukraineScoreEl.textContent =
    numberFormat(ukraineScore);

    russiaScoreEl.textContent =
    numberFormat(russiaScore);


    const up =
    Math.min(
        100,
        ukraineScore / MAX_SCORE * 100
    );

    const rp =
    Math.min(
        100,
        russiaScore / MAX_SCORE * 100
    );


    ukraineProgress.style.width =
    up + "%";

    russiaProgress.style.width =
    rp + "%";


    moveCars(up,rp);

}


/* MAŞINLAR */

function moveCars(up,rp){

    const lanes =
    document.querySelectorAll(".lane");

    if(!lanes.length) return;

    const width =
    lanes[0].clientWidth;

    const maxMove =
    Math.max(
        20,
        width - 75
    );


    ukraineCar.style.left =
    (8 + maxMove * up / 100) + "px";


    russiaCar.style.left =
    (8 + maxMove * rp / 100) + "px";

}


/* QALİB */

function checkWinner(){

    if(ukraineScore >= MAX_SCORE){

        finishGame(
            "🇺🇦 УКРАИНА",
            ukraineScore
        );

    }


    if(russiaScore >= MAX_SCORE){

        finishGame(
            "🇷🇺 РОССИЯ",
            russiaScore
        );

    }

}


function finishGame(name,score){

    gameFinished = true;

    winnerName.textContent =
    name + " ПОБЕДИЛА!";

    winnerScore.textContent =
    "Очки: " + numberFormat(score);

    winner.classList.add("show");

}


/* RESET */

function resetGame(){

    ukraineScore = 0;
    russiaScore = 0;

    gameFinished = false;

    winner.classList.remove("show");

    updateScreen();

}


/* TEST */

function testRussia(){

    addScore(
        "russia",
        100
    );

}


function testUkraine(){

    addScore(
        "ukraine",
        100
    );

}


/* TIKTOK GIFT */

function receiveTikTokGift(gift,coins){

    gift =
    String(gift).toLowerCase();

    coins =
    Number(coins);


    if(gift === "crown" ||
       gift === "корона" ||
       gift === "crown_gift"){

        addScore(
            "russia",
            coins
        );

        return;
    }


    if(gift === "hat" ||
       gift === "шапка" ||
       gift === "hat_gift"){

        addScore(
            "ukraine",
            coins
        );

        return;
    }

}


/*
========================================
LIVE SERVER
========================================

Render server hazır olduqda buraya
server linkini yazacağıq.

Məsələn:

const LIVE_SERVER_URL =
"wss://gift-race-server.onrender.com";

Hazırda boş saxlanılıb.
*/


const LIVE_SERVER_URL = "";


function connectLiveServer(){

    if(!LIVE_SERVER_URL){

        statusEl.textContent =
        "● LIVE SYSTEM READY";

        return;
    }


    try{

        const socket =
        new WebSocket(
            LIVE_SERVER_URL
        );


        socket.onopen = function(){

            statusEl.textContent =
            "● LIVE CONNECTED";

        };


        socket.onmessage =
        function(event){

            try{

                const data =
                JSON.parse(event.data);


                if(data.type === "gift"){

                    receiveTikTokGift(
                        data.gift,
                        data.coins
                    );

                }

            }catch(e){

                console.log(e);

            }

        };


        socket.onclose = function(){

            statusEl.textContent =
            "● LIVE DISCONNECTED";

        };


        socket.onerror = function(){

            statusEl.textContent =
            "● LIVE CONNECTION ERROR";

        };


    }catch(e){

        console.log(e);

    }

}


window.addEventListener(
"resize",
function(){
    updateScreen();
});


updateScreen();

connectLiveServer();

</script>

</body>
</html>
