<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GIFT RACE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050507;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:760px;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#08080d;
}

/* HEADER */

.header{
  height:70px;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#101016;
  border-bottom:1px solid #292933;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.live{
  background:#ff1744;
  padding:8px 14px;
  border-radius:20px;
  font-size:13px;
  font-weight:900;
}

.score{
  text-align:right;
}

.score small{
  display:block;
  font-size:10px;
  color:#999;
}

.score strong{
  font-size:23px;
}


/* RACE */

.race{
  flex:1;
  min-height:0;
  margin:8px;
  border:2px solid #292933;
  border-radius:15px;
  overflow:hidden;
  position:relative;
  background:#111117;
}

.finish{
  position:absolute;
  right:15px;
  top:0;
  bottom:0;
  width:6px;
  z-index:10;

  background:
  repeating-linear-gradient(
    to bottom,
    #fff 0px,
    #fff 12px,
    #111 12px,
    #111 24px
  );
}


/* LANE */

.lane{
  height:20%;
  position:relative;
  border-bottom:1px dashed #3b3b45;
}

.lane:last-child{
  border-bottom:none;
}


/* COUNTRY */

.country{
  position:absolute;
  left:7px;
  top:50%;
  transform:translateY(-50%);

  width:105px;

  display:flex;
  align-items:center;
  gap:7px;

  padding:6px 7px;

  background:rgba(0,0,0,.75);
  border:1px solid #393943;
  border-radius:9px;

  z-index:8;
}

.flag{
  font-size:29px;
  line-height:1;
  flex-shrink:0;
}

.country-name{
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}


/* CAR */

.car{
  position:absolute;
  left:125px;
  top:50%;
  transform:translateY(-50%);
  width:82px;
  height:40px;
  transition:left .45s ease;
  z-index:5;
}

.car-body{
  position:absolute;
  width:66px;
  height:24px;
  left:8px;
  top:8px;

  border-radius:7px 13px 8px 8px;

  background:linear-gradient(
    180deg,
    #eee,
    #777
  );

  border:2px solid #292929;
}

.car-top{
  position:absolute;
  width:34px;
  height:18px;
  left:21px;
  top:0;

  border-radius:9px 10px 2px 2px;

  background:#777;
  border:2px solid #292929;
}

.window{
  position:absolute;
  width:24px;
  height:10px;
  left:3px;
  top:3px;

  background:#101722;
  border-radius:4px;
}

.wheel{
  position:absolute;
  width:14px;
  height:14px;

  bottom:0;

  background:#050505;
  border:2px solid #555;
  border-radius:50%;
}

.wheel.one{
  left:14px;
}

.wheel.two{
  right:7px;
}


/* CAR COLORS */

.red .car-body{
  background:linear-gradient(180deg,#ff536b,#900017);
}

.blue .car-body{
  background:linear-gradient(180deg,#52aaff,#07509d);
}

.green .car-body{
  background:linear-gradient(180deg,#4ee58a,#08743b);
}

.yellow .car-body{
  background:linear-gradient(180deg,#ffe86d,#b68700);
}

.purple .car-body{
  background:linear-gradient(180deg,#c875ff,#66229a);
}


/* PLAYER NAME */

.player-name{
  position:absolute;

  left:220px;
  top:9px;

  font-size:10px;
  font-weight:800;

  color:#8e8e98;

  z-index:3;
}


/* BOTTOM */

.bottom{
  height:225px;
  min-height:225px;

  padding:9px 9px 11px;

  background:#09090e;

  border-top:1px solid #292933;
}

.gift-title{
  text-align:center;

  font-size:14px;
  font-weight:900;

  color:#fff;

  margin-bottom:8px;
}


/* GIFTS */

.gifts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.gift{
  height:125px;

  border-radius:14px;

  border:1px solid #343440;

  background:
    linear-gradient(
      180deg,
      #1a1a24,
      #0d0d13
    );

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  position:relative;
}

.gift:active{
  transform:scale(.96);
}

.gift img{
  width:62px;
  height:62px;

  object-fit:contain;

  margin-bottom:5px;
}

.gift-name{
  font-size:13px;
  font-weight:900;
}

.gift-points{
  margin-top:5px;

  font-size:14px;
  font-weight:900;

  color:#ffd43b;
}


/* BUTTONS */

.test{
  width:100%;
  height:36px;

  margin-top:7px;

  border:0;
  border-radius:9px;

  background:#282833;

  color:#fff;

  font-size:12px;
  font-weight:900;
}

.reset{
  background:#15151c;
  border:1px solid #30303a;
}


/* WINNER */

.winner{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.8);

  display:none;

  align-items:center;
  justify-content:center;

  z-index:100;
}

.winner-box{
  width:85%;
  max-width:350px;

  padding:25px;

  text-align:center;

  background:#14141c;

  border:1px solid #454552;

  border-radius:20px;
}

.winner-box h1{
  font-size:28px;
  margin-bottom:10px;
}

.winner-box p{
  color:#aaa;
  margin-bottom:20px;
}

.winner-box button{
  width:100%;
  height:45px;

  border:0;
  border-radius:10px;

  background:#fff;
  color:#000;

  font-weight:900;
}


/* SMALL PHONE */

@media(max-width:380px){

  .country{
    width:98px;
  }

  .flag{
    font-size:25px;
  }

  .country-name{
    font-size:10px;
  }

  .car{
    left:112px;
  }

  .player-name{
    left:205px;
  }

  .gift{
    height:115px;
  }

  .gift img{
    width:55px;
    height:55px;
  }

  .gift-points{
    font-size:13px;
  }
}

</style>
</head>


<body>

<div class="game">


<!-- HEADER -->

<div class="header">

  <div class="logo">
    GIFT RACE
  </div>

  <div class="live">
    ● LIVE
  </div>

  <div class="score">

    <small>ÜMUMİ XAL</small>

    <strong id="totalScore">
      0
    </strong>

  </div>

</div>



<!-- RACE -->

<div class="race">

  <div class="finish"></div>


  <!-- AZERBAIJAN -->

  <div class="lane">

    <div class="country">

      <div class="flag">
        🇦🇿
      </div>

      <div class="country-name">
        AZERBAIJAN
      </div>

    </div>


    <div
      class="player-name"
      id="name0">
      AZERBAIJAN
    </div>


    <div
      class="car red"
      id="car0">

      <div class="car-top">
        <div class="window"></div>
      </div>

      <div class="car-body"></div>

      <div class="wheel one"></div>
      <div class="wheel two"></div>

    </div>

  </div>



  <!-- TURKEY -->

  <div class="lane">

    <div class="country">

      <div class="flag">
        🇹🇷
      </div>

      <div class="country-name">
        TURKEY
      </div>

    </div>


    <div
      class="player-name"
      id="name1">
      TURKEY
    </div>


    <div
      class="car blue"
      id="car1">

      <div class="car-top">
        <div class="window"></div>
      </div>

      <div class="car-body"></div>

      <div class="wheel one"></div>
      <div class="wheel two"></div>

    </div>

  </div>



  <!-- GEORGIA -->

  <div class="lane">

    <div class="country">

      <div class="flag">
        🇬🇪
      </div>

      <div class="country-name">
        GEORGIA
      </div>

    </div>


    <div
      class="player-name"
      id="name2">
      GEORGIA
    </div>


    <div
      class="car green"
      id="car2">

      <div class="car-top">
        <div class="window"></div>
      </div>

      <div class="car-body"></div>

      <div class="wheel one"></div>
      <div class="wheel two"></div>

    </div>

  </div>



  <!-- RUSSIA -->

  <div class="lane">

    <div class="country">

      <div class="flag">
        🇷🇺
      </div>

      <div class="country-name">
        RUSSIA
      </div>

    </div>


    <div
      class="player-name"
      id="name3">
      RUSSIA
    </div>


    <div
      class="car yellow"
      id="car3">

      <div class="car-top">
        <div class="window"></div>
      </div>

      <div class="car-body"></div>

      <div class="wheel one"></div>
      <div class="wheel two"></div>

    </div>

  </div>



  <!-- UKRAINE -->

  <div class="lane">

    <div class="country">

      <div class="flag">
        🇺🇦
      </div>

      <div class="country-name">
        UKRAINE
      </div>

    </div>


    <div
      class="player-name"
      id="name4">
      UKRAINE
    </div>


    <div
      class="car purple"
      id="car4">

      <div class="car-top">
        <div class="window"></div>
      </div>

      <div class="car-body"></div>

      <div class="wheel one"></div>
      <div class="wheel two"></div>

    </div>

  </div>

</div>



<!-- GIFTS -->

<div class="bottom">

  <div class="gift-title">
    TIKTOK HƏDİYYƏLƏRİ
  </div>


  <div class="gifts">


    <!-- GÜL -->

    <div
      class="gift"
      onclick="sendGift(1)">

      <img
        src="images/rose.png"
        alt="Gül">

      <div class="gift-name">
        Gül
      </div>

      <div class="gift-points">
        1 XAL
      </div>

    </div>



    <!-- PARFÜM -->

    <div
      class="gift"
      onclick="sendGift(10)">

      <img
        src="images/perfume.png"
        alt="Parfüm">

      <div class="gift-name">
        Parfüm
      </div>

      <div class="gift-points">
        10 XAL
      </div>

    </div>



    <!-- TAC -->

    <div
      class="gift"
      onclick="sendGift(100)">

      <img
        src="images/crown.png"
        alt="Tac">

      <div class="gift-name">
        Tac
      </div>

      <div class="gift-points">
        100 XAL
      </div>

    </div>



    <!-- ŞAPKA -->

    <div
      class="gift"
      onclick="sendGift(99)">

      <img
        src="images/hat.png"
        alt="Şapka">

      <div class="gift-name">
        Şapka
      </div>

      <div class="gift-points">
        99 XAL
      </div>

    </div>

  </div>


  <button
    class="test"
    onclick="randomGift()">

    TEST HƏDİYYƏ GÖNDƏR

  </button>


  <button
    class="test reset"
    onclick="resetGame()">

    SIFIRLA

  </button>

</div>

</div>



<!-- WINNER -->

<div
  class="winner"
  id="winner">

  <div class="winner-box">

    <h1>
      🏁 QALİB!
    </h1>

    <p id="winnerText"></p>

    <button onclick="closeWinner()">
      DAVAM ET
    </button>

  </div>

</div>



<script>

const players = [

  {
    name:"AZERBAIJAN",
    points:0,
    position:12
  },

  {
    name:"TURKEY",
    points:0,
    position:12
  },

  {
    name:"GEORGIA",
    points:0,
    position:12
  },

  {
    name:"RUSSIA",
    points:0,
    position:12
  },

  {
    name:"UKRAINE",
    points:0,
    position:12
  }

];


let totalScore = 0;

let gameFinished = false;


/* HƏDİYYƏ */

function sendGift(points){

  if(gameFinished){
    return;
  }


  const playerIndex =
    Math.floor(
      Math.random() *
      players.length
    );


  players[playerIndex].points += points;


  totalScore += points;


  document.getElementById(
    "totalScore"
  ).innerText =
    totalScore;


  moveCar(
    playerIndex,
    points
  );


  checkWinner();

}


/* MAŞIN */

function moveCar(
  playerIndex,
  points
){

  const player =
    players[playerIndex];


  const movement =
    points * 0.55;


  player.position +=
    movement;


  if(
    player.position > 83
  ){

    player.position = 83;

  }


  const car =
    document.getElementById(
      "car" + playerIndex
    );


  car.style.left =
    player.position + "%";

}


/* TEST */

function randomGift(){

  const gifts = [
    1,
    10,
    100,
    99
  ];


  const points =
    gifts[
      Math.floor(
        Math.random() *
        gifts.length
      )
    ];


  sendGift(points);

}


/* QALİB */

function checkWinner(){

  for(
    let i=0;
    i<players.length;
    i++
  ){

    if(
      players[i].position >= 83
    ){

      gameFinished = true;


      document.getElementById(
        "winnerText"
      ).innerText =
        players[i].name +
        " qalib oldu!";


      document.getElementById(
        "winner"
      ).style.display =
        "flex";


      break;

    }

  }

}


/* DAVAM */

function closeWinner(){

  document.getElementById(
    "winner"
  ).style.display =
    "none";


  resetGame();

}


/* RESET */

function resetGame(){

  totalScore = 0;

  gameFinished = false;


  document.getElementById(
    "totalScore"
  ).innerText =
    "0";


  players.forEach(
    (player,index)=>{

      player.points = 0;

      player.position = 12;


      document.getElementById(
        "car" + index
      ).style.left =
        "12%";

    }
  );


  document.getElementById(
    "winner"
  ).style.display =
    "none";

}


/*
=========================================
TIKTOK HƏDİYYƏ SİSTEMİ
=========================================

Gül     = 1 xal
Parfüm  = 10 xal
Tac     = 100 xal
Şapka   = 99 xal

Real TikTok bağlantısı əlavə olunanda
server bu funksiyanı çağıracaq.
*/

function receiveTikTokGift(
  giftName,
  points
){

  console.log(
    "TikTok gift:",
    giftName,
    points
  );


  sendGift(points);

}


/* GİFT XƏRİTƏSİ */

const tiktokGifts = {

  rose:{
    name:"Gül",
    points:1,
    image:"images/rose.png"
  },

  perfume:{
    name:"Parfüm",
    points:10,
    image:"images/perfume.png"
  },

  crown:{
    name:"Tac",
    points:100,
    image:"images/crown.png"
  },

  hat:{
    name:"Şapka",
    points:99,
    image:"images/hat.png"
  }

};

</script>

</body>
</html>
