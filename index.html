<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Украина 🇺🇦 vs Россия 🇷🇺</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:
        radial-gradient(circle at top,#202020 0%,#090909 45%,#000 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:18px;
}

.title{
    text-align:center;
    font-size:30px;
    font-weight:900;
    margin-bottom:8px;
    letter-spacing:1px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    font-size:14px;
    margin-bottom:22px;
}

.scoreboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.team{
    position:relative;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:25px;
    padding:22px 15px;
    text-align:center;
    overflow:hidden;
}

.team-name{
    font-size:19px;
    font-weight:900;
    margin-top:12px;
}

.score{
    font-size:40px;
    font-weight:900;
    margin-top:8px;
}

.target{
    color:#888;
    font-size:13px;
}

/* BAYRAQ İKONLARI */

.flag-icon{
    width:92px;
    height:92px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    position:relative;
    border:4px solid rgba(255,255,255,.8);
    box-shadow:
        0 0 20px rgba(255,255,255,.18),
        inset 0 0 15px rgba(0,0,0,.35);
}

/* Ukrayna */
.flag-ukraine{
    background:
        linear-gradient(
            to bottom,
            #0057b8 0%,
            #0057b8 50%,
            #ffd700 50%,
            #ffd700 100%
        );
}

/* Rusiya */
.flag-russia{
    background:
        linear-gradient(
            to bottom,
            #fff 0%,
            #fff 33.33%,
            #0039a6 33.33%,
            #0039a6 66.66%,
            #d52b1e 66.66%,
            #d52b1e 100%
        );
}

/* Parıltı */
.flag-icon::after{
    content:"";
    position:absolute;
    top:0;
    left:15%;
    width:35%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
    transform:skewX(-20deg);
    opacity:.5;
}

/* XAL GƏLƏNDƏ YANIB-SÖNMƏ */

.flag-icon.flash{
    animation:flagFlash .7s ease-in-out 3;
}

@keyframes flagFlash{
    0%{
        transform:scale(1);
        filter:brightness(1);
        box-shadow:
            0 0 20px rgba(255,255,255,.2);
    }

    25%{
        transform:scale(1.18);
        filter:brightness(2);
        box-shadow:
            0 0 35px #fff,
            0 0 70px rgba(255,255,255,.8);
    }

    50%{
        transform:scale(1);
        filter:brightness(1);
    }

    75%{
        transform:scale(1.18);
        filter:brightness(2);
        box-shadow:
            0 0 35px #fff,
            0 0 70px rgba(255,255,255,.8);
    }

    100%{
        transform:scale(1);
        filter:brightness(1);
    }
}

/* PROGRESS */

.progress{
    width:100%;
    height:12px;
    background:#202020;
    border-radius:20px;
    margin-top:15px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    border-radius:20px;
    transition:width .5s ease;
}

.progress-ukraine{
    background:linear-gradient(90deg,#0057b8,#ffd700);
}

.progress-russia{
    background:linear-gradient(90deg,#fff,#0039a6,#d52b1e);
}

/* RACE */

.race{
    margin-top:25px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:20px;
}

.race-title{
    text-align:center;
    font-size:20px;
    font-weight:900;
    margin-bottom:20px;
}

.lane{
    position:relative;
    height:100px;
    margin-bottom:18px;
    background:#111;
    border-radius:18px;
    border:1px solid #292929;
    overflow:hidden;
}

.lane:last-child{
    margin-bottom:0;
}

.lane-label{
    position:absolute;
    top:10px;
    left:15px;
    z-index:5;
    font-size:14px;
    font-weight:900;
}

.finish{
    position:absolute;
    right:12px;
    top:0;
    height:100%;
    width:5px;
    background:
        repeating-linear-gradient(
            to bottom,
            #fff 0,
            #fff 10px,
            #111 10px,
            #111 20px
        );
}

.car{
    position:absolute;
    left:10px;
    bottom:15px;
    width:80px;
    height:38px;
    border-radius:12px 18px 8px 8px;
    transition:left .7s ease;
    z-index:3;
}

.car::before{
    content:"";
    position:absolute;
    width:35px;
    height:20px;
    left:23px;
    top:-13px;
    border-radius:8px 8px 2px 2px;
    background:inherit;
}

.car::after{
    content:"";
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#050505;
    left:10px;
    bottom:-6px;
    box-shadow:48px 0 0 #050505;
}

.car-ukraine{
    background:linear-gradient(135deg,#0057b8,#ffd700);
}

.car-russia{
    background:linear-gradient(135deg,#fff,#0039a6,#d52b1e);
}

/* GIFTS */

.gifts{
    margin-top:25px;
}

.gifts-title{
    text-align:center;
    font-size:20px;
    font-weight:900;
    margin-bottom:15px;
}

.gift-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.gift{
    background:#111;
    border:1px solid #292929;
    border-radius:20px;
    padding:20px;
    text-align:center;
}

.gift-icon{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    background:#1d1d1d;
}

.gift-name{
    margin-top:10px;
    font-weight:900;
}

.gift-team{
    color:#aaa;
    font-size:13px;
    margin-top:5px;
}

/* TEST */

.controls{
    margin-top:25px;
    display:grid;
    gap:10px;
}

button{
    border:0;
    border-radius:14px;
    padding:15px;
    color:#fff;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.btn-russia{
    background:#9b1c1c;
}

.btn-ukraine{
    background:#0758a8;
}

.btn-reset{
    background:#333;
}

button:active{
    transform:scale(.97);
}

/* WINNER */

.winner{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:100;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.winner.show{
    display:flex;
}

.winner-box{
    background:#151515;
    border:1px solid #444;
    border-radius:30px;
    padding:40px 25px;
    width:100%;
    max-width:500px;
    box-shadow:0 0 60px rgba(255,255,255,.15);
}

.winner-title{
    font-size:45px;
    font-weight:900;
}

.winner-name{
    font-size:30px;
    margin-top:15px;
}

.winner-score{
    color:#aaa;
    margin-top:10px;
}

/* RESPONSIVE */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .title{
        font-size:23px;
    }

    .flag-icon{
        width:72px;
        height:72px;
    }

    .score{
        font-size:30px;
    }

    .team-name{
        font-size:15px;
    }

    .race{
        padding:12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        🇺🇦 УКРАИНА VS РОССИЯ 🇷🇺
    </div>

    <div class="subtitle">
        Первый до 500 000 очков побеждает
    </div>

    <div class="scoreboard">

        <!-- UKRAINE -->

        <div class="team">

            <div id="ukraineFlag"
                 class="flag-icon flag-ukraine">
            </div>

            <div class="team-name">
                УКРАИНА
            </div>

            <div id="ukraineScore"
                 class="score">
                0
            </div>

            <div class="target">
                / 500 000
            </div>

            <div class="progress">
                <div id="ukraineProgress"
                     class="progress-bar progress-ukraine">
                </div>
            </div>

        </div>

        <!-- RUSSIA -->

        <div class="team">

            <div id="russiaFlag"
                 class="flag-icon flag-russia">
            </div>

            <div class="team-name">
                РОССИЯ
            </div>

            <div id="russiaScore"
                 class="score">
                0
            </div>

            <div class="target">
                / 500 000
            </div>

            <div class="progress">
                <div id="russiaProgress"
                     class="progress-bar progress-russia">
                </div>
            </div>

        </div>

    </div>


    <!-- RACE -->

    <div class="race">

        <div class="race-title">
            🏁 ГОНКА
        </div>

        <div class="lane">

            <div class="lane-label">
                🇺🇦 УКРАИНА
            </div>

            <div id="ukraineCar"
                 class="car car-ukraine">
            </div>

            <div class="finish"></div>

        </div>


        <div class="lane">

            <div class="lane-label">
                🇷🇺 РОССИЯ
            </div>

            <div id="russiaCar"
                 class="car car-russia">
            </div>

            <div class="finish"></div>

        </div>

    </div>


    <!-- GIFTS -->

    <div class="gifts">

        <div class="gifts-title">
            🎁 ПОДАРКИ TIKTOK LIVE
        </div>

        <div class="gift-grid">

            <div class="gift">

                <div class="gift-icon">
                    👑
                </div>

                <div class="gift-name">
                    КОРОНА
                </div>

                <div class="gift-team">
                    → РОССИЯ
                </div>

            </div>


            <div class="gift">

                <div class="gift-icon">
                    🧢
                </div>

                <div class="gift-name">
                    ШАПКА
                </div>

                <div class="gift-team">
                    → УКРАИНА
                </div>

            </div>

        </div>

    </div>


    <!-- TEST BUTTONS -->

    <div class="controls">

        <button
            class="btn-russia"
            onclick="testRussia()">
            ТЕСТ: КОРОНА → РОССИЯ +100
        </button>

        <button
            class="btn-ukraine"
            onclick="testUkraine()">
            ТЕСТ: ШАПКА → УКРАИНА +100
        </button>

        <button
            class="btn-reset"
            onclick="resetGame()">
            СБРОСИТЬ ИГРУ
        </button>

    </div>

</div>


<!-- WINNER -->

<div id="winner"
     class="winner">

    <div class="winner-box">

        <div class="winner-title">
            🏆
        </div>

        <div id="winnerName"
             class="winner-name">
        </div>

        <div id="winnerScore"
             class="winner-score">
        </div>

        <br>

        <button
            class="btn-reset"
            onclick="resetGame()">
            НОВАЯ ИГРА
        </button>

    </div>

</div>


<script>

/* =========================
   GAME SETTINGS
========================= */

const MAX_SCORE = 500000;

let ukraineScore = 0;
let russiaScore = 0;

let gameFinished = false;


/* =========================
   ELEMENTS
========================= */

const ukraineScoreEl =
    document.getElementById("ukraineScore");

const russiaScoreEl =
    document.getElementById("russiaScore");

const ukraineProgressEl =
    document.getElementById("ukraineProgress");

const russiaProgressEl =
    document.getElementById("russiaProgress");

const ukraineCar =
    document.getElementById("ukraineCar");

const russiaCar =
    document.getElementById("russiaCar");

const ukraineFlag =
    document.getElementById("ukraineFlag");

const russiaFlag =
    document.getElementById("russiaFlag");

const winner =
    document.getElementById("winner");

const winnerName =
    document.getElementById("winnerName");

const winnerScore =
    document.getElementById("winnerScore");


/* =========================
   FORMAT NUMBER
========================= */

function formatNumber(number){

    return Math.floor(number)
        .toLocaleString("ru-RU");

}


/* =========================
   FLAG FLASH
========================= */

function flashFlag(team){

    const flag =
        team === "ukraine"
        ? ukraineFlag
        : russiaFlag;

    flag.classList.remove("flash");

    /* animasiyanı yenidən başlat */
    void flag.offsetWidth;

    flag.classList.add("flash");

    setTimeout(() => {

        flag.classList.remove("flash");

    }, 2300);
}


/* =========================
   ADD SCORE
========================= */

function addScore(team, points, giftName = ""){

    if(gameFinished) return;

    points = Number(points);

    if(!Number.isFinite(points) || points <= 0){
        return;
    }

    if(team === "ukraine"){

        ukraineScore += points;

        if(ukraineScore > MAX_SCORE){
            ukraineScore = MAX_SCORE;
        }

        flashFlag("ukraine");

    }

    if(team === "russia"){

        russiaScore += points;

        if(russiaScore > MAX_SCORE){
            russiaScore = MAX_SCORE;
        }

        flashFlag("russia");

    }

    updateScreen();

    checkWinner();

}


/* =========================
   UPDATE SCREEN
========================= */

function updateScreen(){

    ukraineScoreEl.textContent =
        formatNumber(ukraineScore);

    russiaScoreEl.textContent =
        formatNumber(russiaScore);


    let ukrainePercent =
        (ukraineScore / MAX_SCORE) * 100;

    let russiaPercent =
        (russiaScore / MAX_SCORE) * 100;


    if(ukrainePercent > 100){
        ukrainePercent = 100;
    }

    if(russiaPercent > 100){
        russiaPercent = 100;
    }


    ukraineProgressEl.style.width =
        ukrainePercent + "%";

    russiaProgressEl.style.width =
        russiaPercent + "%";


    /*
       Maşının hərəkəti
    */

    const laneWidth =
        document.querySelector(".lane").clientWidth;

    const carWidth = 80;

    const maxMove =
        laneWidth - carWidth - 25;


    ukraineCar.style.left =
        Math.max(
            10,
            (maxMove * ukrainePercent / 100)
        ) + "px";


    russiaCar.style.left =
        Math.max(
            10,
            (maxMove * russiaPercent / 100)
        ) + "px";

}


/* =========================
   CHECK WINNER
========================= */

function checkWinner(){

    if(ukraineScore >= MAX_SCORE){

        finishGame(
            "🇺🇦 УКРАИНА",
            ukraineScore
        );

        return;
    }


    if(russiaScore >= MAX_SCORE){

        finishGame(
            "🇷🇺 РОССИЯ",
            russiaScore
        );

        return;
    }

}


/* =========================
   FINISH GAME
========================= */

function finishGame(name, score){

    gameFinished = true;

    winnerName.textContent =
        name + " ПОБЕДИЛА!";

    winnerScore.textContent =
        "Очки: " + formatNumber(score);

    winner.classList.add("show");

}


/* =========================
   RESET
========================= */

function resetGame(){

    ukraineScore = 0;
    russiaScore = 0;

    gameFinished = false;

    winner.classList.remove("show");

    updateScreen();

}


/* =========================
   TEST BUTTONS
========================= */

function testRussia(){

    addScore(
        "russia",
        100,
        "Корона"
    );

}


function testUkraine(){

    addScore(
        "ukraine",
        100,
        "Шапка"
    );

}


/* =========================
   TIKTOK GIFT HANDLER
========================= */

/*
   Serverdən belə məlumat gələndə:

   {
      gift: "crown",
      coins: 100
   }

   Rusiya +100 alır.

   {

      gift: "hat",
      coins: 500

   }

   Ukrayna +500 alır.
*/

function receiveTikTokGift(gift, coins){

    gift = String(gift).toLowerCase();

    coins = Number(coins);


    if(gift === "crown" ||
       gift === "корона" ||
       gift === "crown_gift"){

        addScore(
            "russia",
            coins,
            "Корона"
        );

        return;
    }


    if(gift === "hat" ||
       gift === "шапка" ||
       gift === "hat_gift"){

        addScore(
            "ukraine",
            coins,
            "Шапка"
        );

        return;
    }

}


/* =========================
   LIVE SERVER CONNECTION
========================= */

/*
   BURA Render serverinin linki
   əlavə olunacaq.

   Məsələn:

   https://gift-race-server.onrender.com

   Server hazır olanda aşağıdakı
   URL-i dəyişəcəyik.
*/

const LIVE_SERVER_URL = "";


/*
   Əgər server URL yazılıbsa,
   WebSocket bağlantısı qurulur.
*/

function connectLiveServer(){

    if(!LIVE_SERVER_URL){

        console.log(
            "Live server hələ qoşulmayıb."
        );

        return;
    }


    try{

        const socket =
            new WebSocket(
                LIVE_SERVER_URL
            );


        socket.onopen = function(){

            console.log(
                "LIVE SERVER CONNECTED"
            );

        };


        socket.onmessage = function(event){

            try{

                const data =
                    JSON.parse(event.data);


                /*
                   Serverdən gələn məlumat:

                   {
                     type:"gift",
                     gift:"crown",
                     coins:100
                   }
                */

                if(data.type === "gift"){

                    receiveTikTokGift(
                        data.gift,
                        data.coins
                    );

                }

            }catch(error){

                console.log(
                    "Server data error",
                    error
                );

            }

        };


        socket.onclose = function(){

            console.log(
                "LIVE SERVER DISCONNECTED"
            );

        };


        socket.onerror = function(error){

            console.log(
                "LIVE SERVER ERROR",
                error
            );

        };

    }catch(error){

        console.log(error);

    }

}


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    updateScreen
);


/* =========================
   START
========================= */

updateScreen();

connectLiveServer();

</script>

</body>
</html>
